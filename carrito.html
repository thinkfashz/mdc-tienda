<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito — MDC Ferretería Linares</title>
<link rel="icon" type="image/png" href="assets/logo-claro.png">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body class="page-inner">

<nav class="nav">
  <a class="nav-logo" href="index.html">
    <img src="assets/logo-claro.png" alt="MDC Ferretería">
    <span class="nav-brand">Ferretería <b>MDC</b></span>
  </a>
  <div class="nav-links">
    <a href="index.html">Inicio</a>
    <a href="catalogo.html">Catálogo</a>
    <a href="index.html#contacto">Contacto</a>
  </div>
  <div class="nav-right">
    <a class="cart-btn" href="carrito.html" aria-label="Carrito">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-count" data-cart-count>0</span>
    </a>
    <a class="nav-cta" href="https://wa.me/56920688075?text=Hola%20MDC" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.9-1.1-4.7-4-4.9-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.5.5c-.2.2-.3.4-.1.7.2.3.9 1.5 2 2.4 1.4 1.2 2.5 1.6 2.8 1.7.3.1.5.1.7-.1l1-1.2c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.4 0 .1 0 .7-.3 1.2Z"/></svg>
      Cotizar
    </a>
  </div>
</nav>

<main class="cart-page">
  <div class="catalog-head">
    <p class="kicker">Tu compra</p>
    <h1>Carrito</h1>
  </div>
  <div id="cart-root"></div>
</main>

<footer class="footer">
  <img src="assets/logo-claro.png" alt="MDC" class="footer-logo">
  <p>© 2026 MDC Ferretería · Linares, Chile</p>
</footer>

<script src="app.js?v=2"></script>
<script>
  const root = document.getElementById("cart-root");

  function renderCart() {
    const cart = getCart();
    if (!cart.length) {
      root.innerHTML = `
        <div class="cart-empty">
          <p>Tu carrito está vacío.</p>
          <a class="btn btn-solid" href="catalogo.html">Ver catálogo</a>
        </div>`;
      return;
    }
    const items = cart.map(i => ({ ...i, p: LiveCatalog.byId(i.id) })).filter(i => i.p);
    if (!items.length) {
      root.innerHTML = `
        <div class="cart-empty">
          <p>Los productos del carrito ya no están disponibles.</p>
          <a class="btn btn-solid" href="catalogo.html">Ver catálogo</a>
        </div>`;
      return;
    }
    const total = items.reduce((s, i) => s + i.p.precio * i.qty, 0);
    const waMsg = `Hola MDC, quiero hacer este pedido:%0A${items.map(i => `• ${i.qty}x ${i.p.nombre} — ${CLP(i.p.precio * i.qty)}`).join("%0A")}%0A%0ATotal: ${CLP(total)}`;

    root.innerHTML = `
      <div class="cart-grid">
        <div class="cart-items">
          ${items.map(i => `
            <div class="cart-item">
              <img src="${i.p.img}" alt="${i.p.nombre}" onerror="this.src='assets/p-herramientas.png'">
              <div class="ci-info">
                <a href="producto.html?id=${i.p.id}" class="ci-nombre">${i.p.nombre}</a>
                <p class="ci-marca">${i.p.marca}</p>
                ${i.qty > i.p.stock && i.p.stock > 0
                  ? `<p class="ci-warn">Solo quedan ${i.p.stock} — ajusta la cantidad</p>`
                  : stockBadge(i.p.stock, i.p.minStock)}
                <div class="qty qty-sm">
                  <button data-dec="${i.p.id}" aria-label="Restar">−</button>
                  <span>${i.qty}</span>
                  <button data-inc="${i.p.id}" aria-label="Sumar" ${i.qty >= i.p.stock && i.p.stock > 0 ? "disabled" : ""}>+</button>
                </div>
              </div>
              <div class="ci-right">
                <b>${CLP(i.p.precio * i.qty)}</b>
                <button class="ci-del" data-del="${i.p.id}">Eliminar</button>
              </div>
            </div>`).join("")}
          <button class="cart-clear" id="clear-btn">Vaciar carrito</button>
        </div>
        <aside class="cart-summary">
          <p class="c-label">Resumen</p>
          <div class="cs-row"><span>Productos</span><b>${cartCount()}</b></div>
          <div class="cs-row"><span>Despacho</span><b>A convenir</b></div>
          <div class="cs-row cs-total"><span>Total</span><b>${CLP(total)}</b></div>
          <a class="btn btn-solid cs-cta" href="checkout.html">
            Finalizar compra
          </a>
          <a class="pdp-wa" style="margin-top:.9rem;display:block;text-align:center" href="https://wa.me/56920688075?text=${waMsg}" target="_blank" rel="noopener">
            o pedir por WhatsApp →
          </a>
          <p class="cs-note">Te confirmamos stock y despacho por WhatsApp.</p>
        </aside>
      </div>`;

    root.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => {
      const it = getCart().find(i => i.id === b.dataset.inc);
      setQty(b.dataset.inc, it.qty + 1); renderCart();
    });
    root.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => {
      const it = getCart().find(i => i.id === b.dataset.dec);
      setQty(b.dataset.dec, it.qty - 1); renderCart();
    });
    root.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      setQty(b.dataset.del, 0); renderCart(); toast("Producto eliminado");
    });
    document.getElementById("clear-btn").onclick = () => { clearCart(); renderCart(); };
  }

  async function init() {
    if (!LiveCatalog.loaded) await LiveCatalog.load();
    renderCart();
    // re-render si el stock cambia
    LiveCatalog.onChange(() => renderCart());
    setInterval(async () => {
      const cart = getCart();
      await LiveCatalog.refreshStock(cart.map(i => i.id));
    }, 20000);
  }

  init();
  updateCartCount();
</script>

</body>
</html>
