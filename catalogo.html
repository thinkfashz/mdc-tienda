<script src="app.js?v=2"></script>
<script>
  const PER_PAGE = 8;
  const REFRESH_MS = 20000;
  const params = new URLSearchParams(location.search);
  let cat = params.get("cat") || "todos";
  let page = 1;

  const chipsEl = document.getElementById("chips");
  const grid = document.getElementById("catalog-grid");
  const pager = document.getElementById("pager");
  const emptyEl = document.getElementById("catalog-empty");
  const catNames = new Map();
  let catOrder = ["todos"];

  function buildChips() {
    chipsEl.innerHTML = "";
    catOrder.forEach(id => {
      const b = document.createElement("button");
      b.className = "chip" + (id === cat ? " is-active" : "");
      b.textContent = id === "todos" ? "Todos" : (catNames.get(id) || id);
      b.onclick = () => {
        cat = id; page = 1;
        history.replaceState(null, "", id === "todos" ? "catalogo.html" : `catalogo.html?cat=${id}`);
        buildChips(); renderPage();
      };
      chipsEl.appendChild(b);
    });
  }

  function filtered() {
    return cat === "todos" ? LiveCatalog.products : LiveCatalog.products.filter(p => p.cat === cat);
  }

  function renderPage() {
    const list = filtered();
    const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
    page = Math.min(page, pages);
    const slice = list.slice((page - 1) * PER_PAGE, page * PER_PAGE);

    renderProducts(grid, slice);
    emptyEl.hidden = list.length > 0;

    pager.innerHTML = "";
    if (pages <= 1) return;
    const mk = (label, target, disabled, current) => {
      const b = document.createElement("button");
      b.className = "pager-btn" + (current ? " is-current" : "");
      b.innerHTML = label;
      b.disabled = disabled;
      b.onclick = () => { page = target; renderPage(); window.scrollTo({ top: 0, behavior: "smooth" }); };
      pager.appendChild(b);
    };
    mk("←", page - 1, page === 1);
    for (let i = 1; i <= pages; i++) mk(String(i), i, false, i === page);
    mk("→", page + 1, page === pages);
  }

  function rebuildCats() {
    catNames.clear();
    catOrder = ["todos"];
    LiveCatalog.products.forEach(p => {
      if (p.cat && !catNames.has(p.cat)) {
        catNames.set(p.cat, p.catNombre);
        catOrder.push(p.cat);
      }
    });
    if (!catOrder.includes(cat)) cat = "todos";
    buildChips();
  }

  async function init() {
    await LiveCatalog.load();
    rebuildCats();
    renderPage();
    // stock en vivo cada 20s
    setInterval(async () => {
      await LiveCatalog.refreshStock(LiveCatalog.products.map(p => p.id));
    }, REFRESH_MS);
  }

  LiveCatalog.onChange(() => {
    // re-render suave manteniendo página/filtro
    rebuildCats();
    renderPage();
  });

  init();
  updateCartCount();
</script>
